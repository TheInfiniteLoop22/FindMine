name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `prisma generate` runs as postinstall - it only reads schema.prisma
      # to generate client types, it does not need a live database, so no
      # DATABASE_URL/secrets are required for this job.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # The codebase currently has a pre-existing lint baseline (mostly
    # @typescript-eslint/no-explicit-any in the pre-Cloudinary/pre-TS-strict
    # code, e.g. `catch (err: any)`). Making this job required would fail
    # every build on debt unrelated to the change being made, so it reports
    # but never blocks a merge until that baseline is paid down separately.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint .
